server:
  port: 8085

jwt:
  # No repository default is permitted in a production profile.
  secret: ${COMMERCE_JWT_SECRET}

spring:
  datasource:
    url: ${COMMERCE_DB_URL}
    username: ${COMMERCE_DB_USERNAME}
    password: ${COMMERCE_DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 20
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        login-username: ${DRUID_ADMIN_USERNAME}
        login-password: ${DRUID_ADMIN_PASSWORD}
  data:
    mongodb:
      host: ${COMMERCE_MONGO_HOST}
      port: 27017
      database: ${COMMERCE_MONGO_DATABASE}
    redis:
      host: ${COMMERCE_REDIS_HOST}
      database: 0
      port: 6379
      password: ${COMMERCE_REDIS_PASSWORD}
      timeout: 300ms
  rabbitmq:
    host: ${COMMERCE_RABBITMQ_HOST}
    port: 5672
    virtual-host: ${COMMERCE_RABBITMQ_VHOST}
    username: ${COMMERCE_RABBITMQ_USERNAME}
    password: ${COMMERCE_RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated

mongo:
  insert:
    sqlEnable: true

logging:
  file:
    path: /var/logs
  level:
    root: info
    com.macro.mall: info

logstash:
  host: ${LOGSTASH_HOST:logstash}

alipay:
  gatewayUrl: ${ALIPAY_GATEWAY_URL}
  appId: ${ALIPAY_APP_ID}
  alipayPublicKey: ${ALIPAY_PUBLIC_KEY}
  appPrivateKey: ${ALIPAY_PRIVATE_KEY}
  returnUrl: ${ALIPAY_RETURN_URL}
  notifyUrl: ${ALIPAY_NOTIFY_URL}

object-storage:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_EVIDENCE_BUCKET}

management:
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # An explicit full OTLP HTTP traces URL is required in production.
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
